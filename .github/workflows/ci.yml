name: CI/CD Pipeline

# Trigger: run this pipeline on every push to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    # GitHub gives you a free Ubuntu VM to run this on
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Check out your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Install Python 3.12 on the VM
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3 — Install your app's dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx==0.24.1
          
      # Step 4 — Run your tests
      # If any test fails, the pipeline stops here — nothing gets deployed
      - name: Run tests
        env:
          TESTING: "true"
        run: pytest tests/ -v

      # Step 5 — Log into Docker Hub using your secrets
      - name: Login to Docker Hub
        # Only runs on push to main, not on pull requests
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6 — Build your Docker image and push it to Docker Hub
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Image is named: yourusername/devops-project:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest